_merge: deep
form:
  netlify: false # Set false to disable Netlify forms
  action: false # Replace by URL from formspree, fabform, kwes…

search:
  enable: true # Set true to enable search
  layout: modal # Also raw modal or drawer
  filter: false # Set true to add filters by type
  sort: true

docs:
  thumbnail:
    desktop: '38x38'
    desktop_large: '100x100'
    mobile: '38x38'
    scrollsnap: '38x38'

css:
  darkmode: true
  preload: true
  print: true
  postcss: 'postcss/design-system'

# Admin
admin:
  cms: sveltiacms
  name: github
  repo: tomgue/tomgue.github.io
  preview: true
  publish_mode: editorial_workflow
  netlify:
    identity: false
  collections:
    indexes:
      enable: true
