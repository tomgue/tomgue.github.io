_merge: deep

css:
  darkmode: true
  preload: true
  print: true
  postcss: 'postcss/design-system'

# Search
search:
  enable: true # Set true to enable search
  layout: drawer # Also raw, modal or drawer
  filter: false # Set true to add filters by type
  sort: true # Set true to add filters by type

# Admin
admin:
  cms: sveltiacms
  name: github
  repo: tomgue/tomgue.github.io
  publish_mode: preview
  netlify:
    identity: false
  fields:
    text_markdown:
      minimal: false
      modes: "['rich_text', 'raw']"

  shortcodes:
    # Surcharge de la liste par défaut du module hugolify-admin (les listes ne
    # fusionnent pas) : 18 shortcodes du module + abbr.
    enable:
      - alert
      - alert-block
      - badge
      - blank_link
      - blockquote
      - details
      - figure
      - icon
      - map
      - qr
      - span_lang
      - twitch
      - twitter
      - video
      - vimeo
      - youtube
      - abbr

  collections:
    persons:
      media_folder: /assets/images/uploads/persons
      public_folder: /images/uploads/persons
      summary_fields:
        - summary
        - firstname
        - lastname
        - persons_places
        - persons_expertises
        - field: contact.email
          label: Email
    indexes:
      enable: false
    config:
      # files : surcharge la liste par défaut du module (nav-primary, nav-legal, seo)
      files:
        [
          nav-header-primary,
          nav-header-secondary,
          nav-footer-primary,
          nav-footer-secondary,
          nav-legal,
          nav-social,
          banner,
          footer,
          credit,
          schema,
          seo,
          llms,
          llms-full,
          abbr
        ]
