_merge: deep

# Analytics — services alternatifs (Umami, Plausible, Matomo, Seline, Fathom, GoatCounter, Simple Analytics, Cabin)
# Activation par présence du bloc ; un bloc incomplet fait échouer le build (errorf dans le partial).
# Scripts rendus uniquement en production (hugo.IsProduction dans layouts/_partials/footer/analytics.html).
analytics:
  # Décommentez un bloc pour activer le service correspondant :
  # umami:
  #   website_id: '94db1cb1-74f4-4a40-ad6c-962362670409'
  #   url: '' # optionnel, self-hosted, ex: https://analytics.exemple.com/script.js
  #   domains: '' # optionnel, data-domains, ex: 'exemple.com,www.exemple.com' (protection deploy previews)
  # plausible:
  #   domain: '' # optionnel, défaut = hostname de baseURL
  #   url: '' # optionnel, self-hosted, ex: https://plausible.exemple.com/js/script.js
  # matomo:
  #   url: 'https://matomo.exemple.com'
  #   site_id: '1'
  #   cookies: false # true = nécessite CookieConsent (bannière)
  # seline:
  #   token: 'PROJECT_TOKEN'
  # fathom:
  #   site_id: 'ABCDEFG'
  #   url: '' # optionnel, défaut https://cdn.usefathom.com/script.js
  # goatcounter:
  #   code: 'yoursite' # SaaS : sous-domaine MYCODE.goatcounter.com (code = MYCODE)
  #   endpoint: '' # optionnel, self-hosted, ex: 'https://stats.exemple.com/count' (prioritaire sur code)
  #   src: '' # optionnel, script self-hosted, ex: '/count.js' ; défaut https://gc.zgo.at/count.js
  simpleanalytics: false # true pour activer, aucun ID requis
  cabin: false # true pour activer, aucun ID requis (domaine à déclarer dans le dashboard Cabin)

css:
  darkmode: true
  preload: true
  print: true
  postcss: 'postcss/design-system'

# Search
search:
  enable: true # Set true to enable search
  layout: drawer # Also raw, modal or drawer
  filter: false # Set true to add filters by type
  sort: true

# Admin
admin:
  cms: sveltiacms
  name: github
  repo: tomgue/tomgue.github.io
  # publish_mode: editorial_workflow
  netlify:
    identity: false
  collections:
    indexes:
      enable: false

# Code blocks — options des blocs de code (render hook layouts/_markup/render-codeblock.html)
# copy : bouton copier le code (JS dans assets/js/components/custom.js)
# icon : icône du langage dans l'en-tête (hugolify-theme-icons)
code:
  copy: true
  icon: true
