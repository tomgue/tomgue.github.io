_merge: deep

# Umami Analytics Configuration
umami:
  enabled: false
  website_id: ''
  src: 'https://cloud.umami.is/script.js'

css:
  darkmode: true
  preload: true
  print: true
  postcss: 'postcss/design-system'

# Search
search:
  enable: true # Set true to enable search
  layout: drawer # Also raw, modal or drawer
  filter: false # Set true to add filters by type
  sort: true

# Admin
admin:
  cms: sveltiacms
  name: github
  repo: tomgue/tomgue.github.io
  publish_mode: preview
  netlify:
    identity: false
  fields:
    text_markdown:
      minimal: false
      modes: "['rich_text', 'raw']"
  collections:
    persons:
      media_folder: /assets/images/persons
      public_folder: /images/persons
      summary_fields:
        - summary
        - firstname
        - lastname
        - persons_places
        - persons_expertises
        - field: contact.email
          label: Email
    indexes:
      enable: false
    # Albums — habillage Sveltia de la collection publications
    # (doc : https://www.hugolify.io/docs/admin/v2/collections/)
    publications:
      icon:
        lucide: images
      sortable_fields:
        - field: date
          default_sort: desc
      view_groups:
        - label: Année
          field: date
          pattern: '\d{4}'
      reorder: true
      # thumbnail : automatique avec la couverture (image)
    config:
      # files : surcharge la liste par défaut du module (nav-primary, nav-legal, seo)
      files: [abbr,nav-header-primary, nav-header-secondary, nav-footer-primary, nav-footer-secondary, nav-legal, nav-social, banner, footer, credit, schema, seo, llms, llms-full]

# Code blocks — options des blocs de code (render hook layouts/_markup/render-codeblock.html)
# copy : bouton copier le code (JS dans assets/js/components/custom.js)
# icon : icône du langage dans l'en-tête (hugolify-theme-icons)
code:
  copy: true
  icon: true
