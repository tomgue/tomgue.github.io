_merge: deep

font_awesome_kit: 'e1fcc4861e'

# Umami Analytics Configuration
umami:
  enabled: true
  website_id: 'be9bcb10-25a5-44a6-b0b7-59c84d81c202'
  src: 'https://cloud.umami.is/script.js'

# logo:
#   header: '/assets/images/logo.svg'
#   footer: '/assets/images/logo-footer.svg' # default: /assets/images/logo.svg

image:
  retina:
    desktop: true # default false, Set true to enable retina for desktop

css:
  darkmode: true
  preload: true
  print: true
  postcss: 'postcss/design-system'

# Search
search:
  enable: true # Set true to enable search
  layout: drawer # Also raw, modal or drawer
  filter: false # Set true to add filters by type
  sort: true

# Admin
admin:
  cms: sveltiacms
  name: github
  repo: tomgue/tomgue.github.io
  title: TomLab CMS
  media_folder: images/uploads
  public_folder: images/uploads
  netlify:
    identity: false
  collections:
    pages:
      thumbnail: hero.images.src
      media_folder: '{{media_folder}}/pages'
      public_folder: '{{public_folder}}/pages'
      summary: "**{{title}}** - {{draft | ternary('⛔️ Brouillon', '✅ _Publié_')}}"
    docs:
      thumbnail: images.src
      media_folder: '{{media_folder}}/docs'
      public_folder: '{{public_folder}}/docs'
      summary: "**{{title}}** - {{draft | ternary('⛔️ Brouillon', '✅ _Publié_')}}"
      nested:
        depth: 10
        subfolders: true
    indexes:
      enable: false

markup:
  goldmark:
    extensions:
      extras:
        delete:
          enable: true
        insert:
          enable: true
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true
      strikethrough: false
