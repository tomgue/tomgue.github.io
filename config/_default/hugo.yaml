## LANGUAGE
defaultContentLanguage: fr
enableEmoji: true
enableRobotsTXT: true

markup:
  goldmark:
    parser:
      attribute:
        block: true # Attributs de bloc Markdown ({state="..."} sous un callout)
    extensions:
      extras:
        delete:
          enable: true
        insert:
          enable: true
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true
      strikethrough: false
