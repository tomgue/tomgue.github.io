## LANGUAGE
defaultContentLanguage: fr
enableEmoji: true
enableRobotsTXT: true

markup:
  goldmark:
    extensions:
      extras:
        delete:
          enable: true
        insert:
          enable: true
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true
      strikethrough: false
  highlight:
    # CSS classes instead of inline colors: the palettes of
    # layouts/_partials/highlight.html provide them (light + dark).
    noClasses: false
    # Default palette — the dark pair resolves through Chroma's
    # counterpart (github -> github-dark). Free pair through
    # params.code.styles.light/.dark.
    style: github
