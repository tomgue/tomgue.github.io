name: Update Hugolify modules

# Manually triggered: bumps every hugolify module to its latest release
# tag (never upstream HEAD), refreshes npm deps (hugo mod npm pack),
# then opens a PR to main.
# No deploy preview on this repo: test locally (hugo server -D) before
# merge. Merging to main triggers the Deploy Hugolify workflow, i.e.
# production (tomgue.github.io) goes live immediately.
#
# The created PR embeds the update details (hugo mod get log, go.mod
# diff, changed files) so the review shows exactly what was bumped
# directly in the PR description, without leaving the page.
#
# Rationale (decided 27/10): hugo mod get -u resolves upstream HEAD
# commits, which are not fetchable when pushed < ~24h earlier — three
# failed runs in one day. Release tags are fetchable almost immediately
# and are what the site actually consumes. The local script
# (yarn update in package.json) stays available for manual HEAD bumps.
# Versions (Hugo, Node) are read from .github/workflows/deploy.yml (env),
# the single source of truth shared with the GitHub Pages deploy.

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Read versions from deploy.yml (single source of truth)
        id: versions
        run: |
          echo "hugo=$(grep -oP '^\s*HUGO_VERSION: \K.*' .github/workflows/deploy.yml)" >> "$GITHUB_OUTPUT"
          echo "node=$(grep -oP '^\s*NODE_VERSION: \K.*' .github/workflows/deploy.yml)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.versions.outputs.hugo }}
          extended: true

      - name: Update Hugo modules to their latest releases (tags only, no -u)
        id: update
        # Bump every hugolify module found in go.mod to its latest git tag.
        # hugo mod get -u would resolve upstream HEAD commits, which are not
        # fetchable when pushed < ~24h earlier (runs #3-#5, 27/10).
        # Icons flow through hugolify-theme-icons and keep static known-good
        # pins (bump manually when needed).
        run: |
          set -o pipefail
          : > "${RUNNER_TEMP}/update.log"
          # head -1 closes the pipe after the first line: git gets SIGPIPE -> exit 141
          # under the default -eo pipefail shell (run #6, 27/10). sed reads all of
          # ls-remote's output before printing only the first line — no early exit.
          latest_tag() { git ls-remote --tags --refs --sort=-v:refname "https://github.com/$1.git" | sed -n '1s#.*refs/tags/##p'; }
          for mod in $(grep -oP 'github\.com/hugolify/[\w-]+(/v2)?(?= )' go.mod | sort -u); do
            repo="${mod#github.com/}"
            repo="${repo%/v2}"
            tag=$(latest_tag "$repo")
            if [ -n "$tag" ]; then
              echo "→ ${mod}@${tag}" | tee -a "${RUNNER_TEMP}/update.log"
              hugo mod get "${mod}@${tag}" 2>&1 | tee -a "${RUNNER_TEMP}/update.log"
            else
              echo "no tag found for $repo, skipped" | tee -a "${RUNNER_TEMP}/update.log"
            fi
          done
          hugo mod get github.com/lucide-icons/lucide@v0.265.1-0.20261016133129-1ef60af944de 2>&1 | tee -a "${RUNNER_TEMP}/update.log"
          hugo mod get github.com/simple-icons/simple-icons@v0.0.0-20260607021030-c3777a7e48a5 2>&1 | tee -a "${RUNNER_TEMP}/update.log"
          hugo mod npm pack 2>&1 | tee -a "${RUNNER_TEMP}/update.log"

      - name: Tidy modules
        run: yarn tidy

      - name: Install npm dependencies
        run: yarn install

      - name: Verify modules download (fail early, before creating the PR)
        run: hugo mod download

      - name: Collect update details for the PR body
        id: details
        run: |
          {
            echo "log<<EOF"
            cat "${RUNNER_TEMP}/update.log" || true
            echo "EOF"
            echo "gomod<<EOF"
            git diff -- go.mod
            echo "EOF"
            echo "stat<<EOF"
            git diff --stat
            echo "EOF"
            echo "files<<EOF"
            git status --porcelain
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create PR to main
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: chore/update-hugolify-modules
          delete-branch: true
          title: 'chore: update Hugolify modules'
          commit-message: 'chore: update Hugolify modules (latest release tags, tidy, install)'
          body: |
            Mise à jour des modules Hugolify vers leur dernière release : bump de chaque module hugolify vers son dernier tag git, pins statiques des libs d'icônes, puis `hugo mod npm pack`, `yarn tidy`, `yarn install`.

            <details>
            <summary>Journal de mise à jour (bumps par tag)</summary>

            ```text
            ${{ steps.details.outputs.log }}
            ```

            </details>

            <details>
            <summary>Diff <code>go.mod</code></summary>

            ```diff
            ${{ steps.details.outputs.gomod }}
            ```

            </details>

            <details>
            <summary>Vue d'ensemble des changements</summary>

            ```text
            ${{ steps.details.outputs.stat }}
            ```

            </details>

            <details>
            <summary>Fichiers modifiés</summary>

            ```text
            ${{ steps.details.outputs.files }}
            ```

            </details>

            - Pas de preview par PR sur ce dépôt : tester en local (`hugo server -D`) avant merge.
            - Le merge vers main déclenche « Deploy Hugolify » → mise en production immédiate de tomgue.github.io.
