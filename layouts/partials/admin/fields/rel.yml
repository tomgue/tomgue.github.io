{{/*
  `rel` field: opt-in value for the HTML `rel` attribute of a link.

  Site override for the rel=me project (PR #25): adds a select widget so the
  admin can manage `rel` per social menu link and per contact social entry.
  `me` marks the target as the same identity (Mastodon / IndieWeb
  cross-verification); leave empty to omit the attribute.
  Labels are hard-coded in French on purpose: the matching i18n keys
  (`admin.fields.rel.*`) will ship with the upstream hugolify-admin PR.
*/}}
{{- $args := dict
  "label" "Rel"
  "hint" "Attribut rel du lien, ex : me (verification Mastodon / IndieWeb)"
  "name" "rel"
  "options" (slice "me")
  -}}

{{ partial "admin/widgets/select.js" $args }}
