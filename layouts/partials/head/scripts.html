{{/* --- UMAMI ANALYTICS --- */}}
{{ with .Site.Params.umami }}
  {{ if and .enabled .src .website_id (not hugo.IsServer) }}
    <script defer 
            data-website-id="{{ .website_id }}" 
            src="{{ .src }}">
    </script>
  {{ end }}
{{ end }}

{{/* --- FONT AWESOME --- */}}
{{ with .Site.Params.font_awesome_kit }}
  <script src="https://kit.fontawesome.com/{{ . }}.js" crossorigin="anonymous"></script>
{{ end }}
