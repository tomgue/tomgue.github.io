{{/* --- UMAMI ANALYTICS --- */}}
{{ with .Site.Params.umami }}
  {{ if and .enabled .src .website_id hugo.IsProduction (not hugo.IsServer) }}
    <script defer src="{{ .src }}" data-website-id="{{ .website_id }}"></script>
  {{ end }}
{{ end }}

{{/* --- FONT AWESOME --- */}}
{{ with .Site.Params.font_awesome_kit }}
  <script src="https://kit.fontawesome.com/{{ . }}.js" crossorigin="anonymous"></script>
{{ end }}
